name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11/3.12/3.13 instalam o backend visual real (TensorFlow/ResNet50/Grad-CAM).
        # 3.14 valida o fallback simulado, já que o TensorFlow ainda não tem build
        # oficial para essa versão (ver requirements.txt e README).
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Checar sintaxe (py_compile)
        run: python -m py_compile app.py

      - name: Lint (ruff, apenas erros reais: imports/nomes não usados ou indefinidos)
        run: ruff check --select F app.py

      - name: Smoke tests do pipeline
        run: pytest tests/ -v
